name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check-types
      - name: Inspect middleware import autofix
        run: |
          pnpm exec eslint src/middleware.ts --fix
          sed -n '1,8p' src/middleware.ts
      - name: ESLint
        run: pnpm lint
      - name: Production build
        run: pnpm build
